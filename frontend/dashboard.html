<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareerInfinity</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card p-4 text-center">
      <h4 id="welcome">Checking your login...</h4>
      <p class="text-muted" id="email"></p>
      <button class="btn btn-outline-secondary" id="logoutBtn">Sign out</button>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";
    document.getElementById("logoutBtn").addEventListener("click", logout);
    apiFetch("/me").then((u) => {
      if (!u) return;
      document.getElementById("welcome").textContent = "You are logged in, " + u.name;
      document.getElementById("email").textContent = u.email;
    });
  </script>
</body>
</html>
